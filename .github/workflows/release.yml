name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --test-name-pattern '(?!benchmarks)'

      - name: Publish to npm with OIDC
        shell: bash
        run: |
          set -euo pipefail

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"
          echo "::add-mask::${oidc_token}"

          for pkg in boards-core boards-client boards-server boards-cli; do
            version="$(bun -e "console.log(require('./packages/${pkg}/package.json').version)")"
            if curl -fsSL -o /dev/null "https://registry.npmjs.org/@saliagadotcom/${pkg}/${version}" 2>/dev/null; then
              echo "::notice::@saliagadotcom/${pkg}@${version} already published — skipping"
              continue
            fi

            encoded="@saliagadotcom%2F${pkg}"

            npm_token="$(
              curl -fsSL -X POST \
                -H "Authorization: Bearer ${oidc_token}" \
                "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encoded}" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])'
            )"
            echo "::add-mask::${npm_token}"

            (
              cd "packages/${pkg}"
              NPM_CONFIG_TOKEN="${npm_token}" bun publish --access public
            )
          done

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
